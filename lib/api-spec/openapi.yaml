components:
  schemas:
    Objection:
      type: object
      required: [id, objection, answer, createdAt]
      properties:
        id: { type: integer }
        objection: { type: string }
        answer: { type: string }
        createdAt: { type: string, format: date-time }
    ObjectionInput:
      type: object
      required: [objection, answer]
      properties:
        objection: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
    Suppression:
      type: object
      required: [id, kind, value, reason, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [email, domain, phone, linkedin] }
        value: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    SuppressionInput:
      type: object
      required: [values]
      properties:
        values: { type: array, items: { type: string }, description: "Emails, @domains, phone numbers or LinkedIn URLs" }
        reason: { type: string }
    SuppressionResult:
      type: object
      required: [added, skipped, leadsStopped]
      properties:
        added: { type: integer }
        skipped: { type: integer }
        leadsStopped: { type: integer }
    TeamMember:
      type: object
      required: [id, name, email, role, leadCount, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, member] }
        leadCount: { type: integer }
        createdAt: { type: string, format: date-time }
    TeamMemberInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        role: { type: string, enum: [admin, member] }
    TeamMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        role: { type: string, enum: [admin, member] }
    Meeting:
      type: object
      required: [id, leadId, leadName, title, startsAt, minutes, provider, status, createdAt]
      properties:
        id: { type: integer }
        leadId: { type: integer }
        leadName: { type: string }
        leadCompany: { type: ["string", "null"] }
        leadEmail: { type: ["string", "null"] }
        dealId: { type: ["integer", "null"] }
        dealName: { type: ["string", "null"] }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        minutes: { type: integer }
        link: { type: ["string", "null"] }
        provider: { type: string, enum: [manual, google, calcom] }
        status: { type: string, enum: [scheduled, completed, canceled, no_show] }
        notes: { type: ["string", "null"] }
        reminderSentAt: { type: ["string", "null"], format: date-time }
        followUpSubject: { type: ["string", "null"] }
        followUpBody: { type: ["string", "null"] }
        followUpSentAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    MeetingInput:
      type: object
      required: [leadId, startsAt]
      properties:
        leadId: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        minutes: { type: integer, minimum: 5, maximum: 480 }
        link: { type: string }
        notes: { type: string }
    MeetingUpdate:
      type: object
      properties:
        title: { type: string }
        startsAt: { type: string, format: date-time }
        minutes: { type: integer, minimum: 5, maximum: 480 }
        link: { type: ["string", "null"] }
        status: { type: string, enum: [scheduled, completed, canceled, no_show] }
        notes: { type: ["string", "null"] }
        followUpSubject: { type: ["string", "null"] }
        followUpBody: { type: ["string", "null"] }
    QuoteItem:
      type: object
      required: [name, quantity, unitPrice]
      properties:
        name: { type: string }
        quantity: { type: number, minimum: 0 }
        unitPrice: { type: number, minimum: 0 }
    Quote:
      type: object
      required: [id, dealId, number, title, items, discountPercent, taxPercent, subtotal, total, status, publicUrl, createdAt]
      properties:
        id: { type: integer }
        dealId: { type: integer }
        dealName: { type: ["string", "null"] }
        number: { type: string }
        title: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/QuoteItem" } }
        discountPercent: { type: integer }
        taxPercent: { type: integer }
        subtotal: { type: number }
        total: { type: number }
        notes: { type: ["string", "null"] }
        validUntil: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [draft, sent, accepted, declined] }
        publicUrl: { type: string }
        sentAt: { type: ["string", "null"], format: date-time }
        respondedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    QuoteInput:
      type: object
      required: [dealId, title, items]
      properties:
        dealId: { type: integer }
        title: { type: string, minLength: 1 }
        items: { type: array, items: { $ref: "#/components/schemas/QuoteItem" } }
        discountPercent: { type: integer, minimum: 0, maximum: 100 }
        taxPercent: { type: integer, minimum: 0, maximum: 100 }
        notes: { type: string }
        validUntil: { type: ["string", "null"], format: date-time }
    QuoteUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        items: { type: array, items: { $ref: "#/components/schemas/QuoteItem" } }
        discountPercent: { type: integer, minimum: 0, maximum: 100 }
        taxPercent: { type: integer, minimum: 0, maximum: 100 }
        notes: { type: ["string", "null"] }
        validUntil: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [draft, sent, accepted, declined] }
    LeadIdsInput:
      type: object
      properties:
        leadIds: { type: array, items: { type: integer }, description: "Omit to process every lead that needs it" }
    SignalScanResult:
      type: object
      required: [scanned, withSignals, skipped]
      properties:
        scanned: { type: integer }
        withSignals: { type: integer }
        skipped: { type: integer, description: "Leads without a website" }
    VerifyResult:
      type: object
      required: [checked, valid, risky, invalid]
      properties:
        checked: { type: integer }
        valid: { type: integer }
        risky: { type: integer }
        invalid: { type: integer }
    OutreachTotals:
      type: object
      required: [sent, opened, clicked, replied, bounced, meetings]
      properties:
        sent: { type: integer }
        opened: { type: integer }
        clicked: { type: integer }
        replied: { type: integer }
        bounced: { type: integer }
        meetings: { type: integer }
    CampaignPerformance:
      allOf:
        - $ref: "#/components/schemas/OutreachTotals"
        - type: object
          required: [campaignId, name, status, cost]
          properties:
            campaignId: { type: integer }
            name: { type: string }
            status: { type: string }
            cost: { type: integer }
            costPerMeeting: { type: ["number", "null"] }
    ChannelPerformance:
      allOf:
        - $ref: "#/components/schemas/OutreachTotals"
        - type: object
          required: [channel]
          properties:
            channel: { type: string }
    StepPerformance:
      allOf:
        - $ref: "#/components/schemas/OutreachTotals"
        - type: object
          required: [campaignId, campaignName, stepOrder, channel, variant]
          properties:
            campaignId: { type: integer }
            campaignName: { type: string }
            stepOrder: { type: integer }
            channel: { type: string }
            variant: { type: string }
    OutreachReport:
      type: object
      required: [currency, totals, campaigns, channels, steps]
      properties:
        currency: { type: string }
        totals: { $ref: "#/components/schemas/OutreachTotals" }
        campaigns: { type: array, items: { $ref: "#/components/schemas/CampaignPerformance" } }
        channels: { type: array, items: { $ref: "#/components/schemas/ChannelPerformance" } }
        steps: { type: array, items: { $ref: "#/components/schemas/StepPerformance" } }

    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Channel:
      type: string
      enum: [email, linkedin, call]
    LeadStatus:
      type: string
      enum: [new, contacted, replied, interested, meeting_booked, not_interested, unsubscribed, nurture, bounced]
    CampaignStatus:
      type: string
      enum: [draft, active, paused, completed]
    ConversationStatus:
      type: string
      enum: [open, auto_replied, needs_review, closed, snoozed]
    CallStatus:
      type: string
      enum: [scheduled, in_progress, completed, no_answer]
    Sentiment:
      type: string
      enum: [positive, neutral, negative, objection, out_of_office, unsubscribe, not_now, referral]

    Lead:
      type: object
      required: [id, firstName, lastName, status, createdAt]
      properties:
        id: { type: integer }
        firstWaitHours: { type: ["integer", "null"], description: "Hours this person waits for message 1 after Start; null follows the campaign pace" }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        company: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/LeadStatus" }
        campaignId: { type: ["integer", "null"] }
        campaignName: { type: ["string", "null"] }
        accountId: { type: ["integer", "null"] }
        accountName: { type: ["string", "null"] }
        currentStep: { type: integer }
        notes: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        fitScore: { type: ["integer", "null"], description: "0-100 AI fit against the ideal customer profile" }
        fitReason: { type: ["string", "null"] }
        companySize: { type: ["string", "null"], description: "Approximate employee count" }
        companyLocation: { type: ["string", "null"] }
        companyLinkedinUrl: { type: ["string", "null"] }
        ownerId: { type: ["integer", "null"] }
        ownerName: { type: ["string", "null"] }
        emailStatus: { type: ["string", "null"], enum: [valid, risky, invalid, bounced, null], description: "Result of the email check; null = not checked" }
        timezone: { type: ["string", "null"], description: "IANA time zone of the person" }
        signals: { type: ["string", "null"], description: "Buying signals, one per line" }
        signalsAt: { type: ["string", "null"], format: date-time }
        lastContactedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    SentItem:
      type: object
      required: [key, kind, channel, leadId, leadName, status, createdAt]
      properties:
        key: { type: string }
        kind: { type: string, enum: [message, call] }
        channel: { type: string }
        leadId: { type: integer }
        leadName: { type: string }
        subject: { type: ["string", "null"] }
